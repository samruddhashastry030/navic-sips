name: rtl-ci
on: [push, pull_request]

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator build-essential
          pip install cocotb
      - name: Lint
        run: verilator --lint-only -Wall rtl/*.sv
      - name: Simulate
        run: make -C tb/cocotb SIM=icarus
